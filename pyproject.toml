[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-face-select-lite"
version = "0.1.0"
description = "CPU-first face image selector for LoRA datasets"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=1.26,<3",
    "onnxruntime>=1.23.1",
    "opencv-python-headless>=4.10,<5",
    "Pillow>=10.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
lora-face-select-lite = "lora_face_select_lite.cli:main"
lora-face-select-lite-gui = "lora_face_select_lite.gui:main"

[tool.setuptools.packages.find]
include = ["lora_face_select_lite*"]
